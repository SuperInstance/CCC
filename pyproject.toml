[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ccc"
version = "0.1.0"
description = "CCC — Central Command Console: unified dashboard for monitoring and controlling agent fleets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["ccc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
